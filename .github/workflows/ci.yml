name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run hermetic unit tests
        run: npm test

      - name: Run installer safety tests
        run: npm run test:install

      - name: Run hook installer tool tests
        run: npm run test:hook-tool

      - name: Run post-commit hook regression tests
        run: npm run test:hook

      - name: Run hook coordination tests
        run: npm run test:coord

      - name: Run hook queue replay tests
        run: npm run test:queue

      - name: Run escaping and deduplication tests
        run: npm run test:escaping

      - name: Run search-engine parity tests
        run: npm run test:search

      - name: Run --root targeting tests
        run: npm run test:root

      - name: Run dry-run and learn-merge tests
        run: npm run test:dry-run

      - name: Run migrate-log regression tests
        run: npm run test:migrate

      - name: Run back-dated milestone tests
        run: npm run test:date

      - name: Run reconciler health tests
        run: npm run test:health

      - name: Run integration tests (temporary vault)
        run: npm run test:integration
