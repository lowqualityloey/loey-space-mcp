name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run hermetic unit tests
        run: npm test

      - name: Run installer safety tests
        run: npm run test:install

      - name: Run post-commit hook regression tests
        run: npm run test:hook

      - name: Run migrate-log regression tests
        run: npm run test:migrate

      - name: Run integration tests (temporary vault)
        run: npm run test:integration
